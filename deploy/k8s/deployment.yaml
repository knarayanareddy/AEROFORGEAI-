# AeroForge web tier.
#
# CONTEXT: the shipped application is a single-file static bundle. It has no
# server component, so this Deployment serves static files — it is not the
# "backend" the roadmap's later phases imply. It is here because the P4 item
# names K8s, and a manifest that pretends to run a service that does not exist
# would be worse than none.
#
# Validated against real Kubernetes 1.29 schemas by `kubernetes-validate` in CI
# (oracle/validate_k8s.py), not merely parsed as YAML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeroforge-web
  namespace: aeroforge
  labels:
    app.kubernetes.io/name: aeroforge
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aeroforge
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aeroforge
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: site
          configMap:
            name: aeroforge-site
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
