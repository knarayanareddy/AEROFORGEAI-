# CI for AeroForge.
#
# The golden job is the important one: it grades a *computed* flow field against
# analytic theory (docs/phase-1-slice.md §2). Everything else checks that the code
# is well-formed; this checks that it is right.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Includes the no-restricted-properties rule that bans Math.random().
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  golden:
    name: Golden physics (wedge vs exact oblique-shock theory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # PASSES only if β and p₂/p₁ land within 2 % of theory at 5°, 10° and 15°.
      # A regression here means the solver is wrong, and the demo must not claim
      # a verified result.
      - name: Wedge golden test
        run: npm run test:golden

  inlet:
    name: Phase 2 inlet golden
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ramp shock vs oblique-shock chain
        run: npm run test:inlet

  bundle:
    name: CEP bundle round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Unit tests for the archive writer
        run: npx vitest run src/lib/zip.test.ts src/lib/cepBundle.test.ts
      - name: Build a bundle and verify it with Python's zipfile
        run: |
          npx tsx scripts/build-reference-bundle.ts
          # 160x100 is deliberately coarse: it should report a FAIL verdict, and
          # the verifier asserts both that the flag agrees with the errors and
          # that the verdict is what we expect. A coarse grid quietly reporting
          # PASS is the failure mode this guards.
          python3 oracle/verify_bundle.py reference_bundle.zip --expect fail
      - name: Confirm the bundle carries SU2 inputs, verified independently
        run: |
          python3 - <<'PY'
          import json, zipfile
          z = zipfile.ZipFile('reference_bundle.zip')
          m = json.loads(z.read('manifest.json'))
          paths = [a['path'] for a in m['artifacts']]
          assert 'su2/inlet.su2' in paths and 'su2/inlet.cfg' in paths, paths
          cfg = z.read('su2/inlet.cfg').decode()
          assert 'has NOT been run' in cfg
          print('bundle carries SU2 inputs and labels them unrun')
          PY

  su2:
    name: SU2 case schema (vs v8.6.0 source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci

      - name: Fetch the SU2 v8.6.0 source
        # The released binaries live on objects.githubusercontent.com; the source
        # tarball does not, and the source is what carries the option registry.
        run: |
          curl -sSL -o su2-src.zip https://codeload.github.com/su2code/SU2/zip/refs/tags/v8.6.0
          unzip -q su2-src.zip

      - name: Re-extract the schema and check it matches the committed one
        # If SU2 changes an option name, this fails here rather than silently
        # producing case files that SU2 ignores.
        run: |
          cp oracle/su2_schema.json /tmp/committed.json
          python oracle/su2_schema.py --extract SU2-8.6.0
          python - <<'PY'
          import json
          a = json.load(open('/tmp/committed.json'))
          b = json.load(open('oracle/su2_schema.json'))
          assert a['options'] == b['options'], 'option registry drifted from committed schema'
          assert a['values'] == b['values'], 'enum values drifted from committed schema'
          print(f"schema matches SU2 source: {len(b['options'])} options, {len(b['values'])} enum values")
          PY

      - name: Generate a case and mesh, then validate them
        run: |
          npx tsx scripts/build-su2-case.ts
          python oracle/su2_schema.py inlet.cfg inlet.su2

      - name: Reject a deliberately broken case
        # A validator that accepts everything is worse than none. This proves the
        # check bites before we rely on the green from the step above.
        run: |
          sed 's/^CFL_NUMBER= 6.0/CFL_NUBMER= 6.0/' inlet.cfg > broken.cfg
          if python oracle/su2_schema.py broken.cfg; then
            echo "validator accepted a misspelled option - check is not working"
            exit 1
          else
            echo "validator correctly rejected the misspelled option"
          fi

  su2-results:
    name: SU2 result parsers (synthetic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Parser unit tests
        # These run against hand-written fixtures, not SU2 output. They check the
        # parser against the format specification in src/lib/su2Results.ts, which
        # cites v8.6.0 source lines. They do not check that SU2 emits that format.
        run: npx vitest run src/lib/su2Results.test.ts

      - name: End-to-end check against the synthetic fixtures
        # Proves the harness (parse -> consistency -> theory comparison) runs.
        # The script prints "MODE: SYNTHETIC" and refuses to claim a run.
        run: |
          npx tsx scripts/check-su2-results.ts             --workdir fixtures/su2 --synthetic             --history fixtures/su2/history.synthetic.csv             --restart fixtures/su2/restart.synthetic.csv

      - name: The synthetic path must not be mistakable for a real run
        # If someone makes the script default to synthetic, or drops the banner,
        # this fails. The whole value of the fixtures is that they cannot be cited.
        run: |
          out=$(npx tsx scripts/check-su2-results.ts             --workdir fixtures/su2 --synthetic             --history fixtures/su2/history.synthetic.csv             --restart fixtures/su2/restart.synthetic.csv)
          echo "$out" | grep -q "SYNTHETIC" || { echo "banner missing"; exit 1; }
          echo "$out" | grep -q "no SU2 run has been verified" || { echo "disclaimer missing"; exit 1; }
          if echo "$out" | grep -qi "^RESULT: PASS"; then echo "synthetic run reported PASS"; exit 1; fi

      - name: The harness must fail cleanly with no SU2 binary
        run: |
          if ./scripts/su2-run.sh --check; then
            echo "prerequisite check passed without an SU2 binary - it should fail"
            exit 1
          fi
          echo "correctly reported missing prerequisites"

      - name: The Slurm scripts must refuse to submit without sbatch
        run: |
          if ./deploy/slurm/submit.sh --dry-run 2>/dev/null; then
            echo "submit.sh did not refuse without sbatch"
            exit 1
          fi
          echo "correctly refused"

  harden:
    name: P4 hardening (Rego, signatures, K8s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install the policy and crypto verifiers
        run: pip install regopy pynacl kubernetes-validate pyyaml

      - name: Evaluate the export policy with a real Rego engine
        # regopy is OPA's Rego runtime, not a simulation. Its output is what the
        # TypeScript mirror is compared against in the next step's test run.
        run: npm run policy:check

      - name: TypeScript mirror must agree with the Rego
        run: npx vitest run src/lib/exportPolicy.conformance.test.ts

      - name: Sign a bundle and verify it with PyNaCl
        # Three independent implementations: Node signs, PyNaCl verifies, and the
        # verifier's negative control proves it is not accepting everything.
        run: npm run sign:check

      - name: Validate the Kubernetes manifests against real schemas
        run: npm run k8s:check

      - name: Reject a malformed manifest
        run: |
          cp deploy/k8s/deployment.yaml /tmp/d.yaml
          sed -i 's/^  replicas: 2/  replicas: "two"/' /tmp/d.yaml
          if python3 oracle/validate_k8s.py /tmp/d.yaml; then
            echo "K8s validator accepted an invalid manifest - check is not working"
            exit 1
          else
            echo "K8s validator correctly rejected a string replica count"
          fi

  oracle:
    name: Independent cross-check (numpy oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numpy
        run: pip install numpy

      - name: Run the reference solver
        # A second, independent implementation (different wave-speed estimate and
        # mesh generator). Agreement with the TypeScript solver is evidence that
        # neither is simply self-consistent.
        run: |
          python oracle/euler_oracle.py \
            --theta 10 --mach 5.5 --nx 360 --ny 220 --max-iter 20000 \
            --json > oracle_result.json
          # Fail loudly here rather than in the assertion below: if stdout ever
          # carries anything but JSON again, the error message should say so.
          python -c "import json; json.load(open('oracle_result.json')); print('oracle output is valid JSON')"
          cat oracle_result.json

      - name: Assert agreement with theory within 3 %
        # Slightly looser than the TypeScript gate because this is a slower,
        # deliberately simpler code path; it exists to catch gross errors, not to
        # replace the golden test.
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("oracle_result.json"))
          errs = r["error_pct"]
          print(f"beta error {errs['beta']:+.2f} %   p2/p1 error {errs['pressure_ratio']:+.2f} %")
          ok = abs(errs["beta"]) < 3.0 and abs(errs["pressure_ratio"]) < 2.0
          print("PASS" if ok else "FAIL")
          sys.exit(0 if ok else 1)
          PY
