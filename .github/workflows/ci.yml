name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (no kernel)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests (kernel tests auto-skip)
        run: pytest -q --cov=aeroforge --cov-report=term-missing

  integration:
    name: integration (CAD + CFD kernels)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenGL/Gmsh runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa
      - name: Install (with CAD + CFD + web extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad,cfd,web,dev]"
      - name: Run full test suite
        run: pytest -q

  lint:
    name: lint (black + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black isort
      - run: black --check aeroforge tests
      - run: isort --check-only aeroforge tests
