<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AeroForge AI — Console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --mut:#8b949e;
          --accent:#3fb6ff; --ok:#3fb950; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header .tag { color:var(--mut); font-size:12px; }
  .wrap { display:grid; grid-template-columns: 420px 1fr; gap:0; height:calc(100vh - 51px); }
  .left { padding:18px 20px; border-right:1px solid var(--line); overflow:auto; }
  .right { position:relative; }
  textarea { width:100%; min-height:80px; background:#0b0f14; color:var(--ink); border:1px solid var(--line);
             border-radius:6px; padding:10px; font:inherit; resize:vertical; }
  .row { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  button { background:#21262d; color:var(--ink); border:1px solid var(--line); border-radius:6px;
           padding:8px 14px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#021018; border-color:var(--accent); font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:12px 0; }
  .card h3 { margin:0 0 8px; font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:13px; }
  .kv b { color:var(--mut); font-weight:400; }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; }
  .pill.ok { background:rgba(63,185,80,.15); color:var(--ok); }
  .pill.warn { background:rgba(210,153,34,.15); color:var(--warn); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; color:var(--mut); margin:6px 0 0; }
  #viewer { width:100%; height:100%; display:block; }
  .hint { color:var(--mut); font-size:12px; }
  a { color:var(--accent); }
  .spin { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>✈ AeroForge AI</h1>
  <span class="tag" id="ver">CAD + CFD automation console</span>
</header>
<div class="wrap">
  <div class="left">
    <label class="hint">Design request (natural language)</label>
    <textarea id="prompt">Design a 2-ramp supersonic inlet for Mach 2.5, total pressure recovery &gt; 0.85, titanium</textarea>
    <div class="row">
      <button class="primary" onclick="runDesign()">Design</button>
      <button onclick="runOptimize()">Optimize</button>
      <button onclick="runCompliance()">Compliance</button>
      <button onclick="runCFD()" id="cfdBtn" disabled>Run CFD</button>
    </div>
    <div id="status" class="hint"></div>
    <div id="out"></div>
  </div>
  <div class="right"><canvas id="viewer"></canvas></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let renderer, scene, camera, controls, mesh;
const canvas = document.getElementById("viewer");
function initViewer(){
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(devicePixelRatio);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d1117);
  camera = new THREE.PerspectiveCamera(45, 1, 0.001, 5000);
  camera.position.set(2,2,2);
  controls = new OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
  const dl = new THREE.DirectionalLight(0xffffff, 1.0); dl.position.set(3,5,4); scene.add(dl);
  scene.add(new THREE.GridHelper(4, 16, 0x30363d, 0x21262d));
  resize(); window.addEventListener("resize", resize);
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
}
function resize(){ const r=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
function showSTL(url){
  new STLLoader().load(url, geo=>{
    if(mesh) scene.remove(mesh);
    geo.computeVertexNormals(); geo.center();
    const m = new THREE.MeshStandardMaterial({color:0x3fb6ff, metalness:0.3, roughness:0.5, flatShading:false});
    mesh = new THREE.Mesh(geo, m); scene.add(mesh);
    geo.computeBoundingSphere(); const r = geo.boundingSphere.radius || 1;
    camera.position.set(r*2.2, r*1.6, r*2.2); controls.target.set(0,0,0); controls.update();
  });
}
initViewer();

const $ = id => document.getElementById(id);
let lastDesignId = null;
const setStatus = (t, spin=false) => $("status").innerHTML = spin ? `<span class="spin">⟳ ${t}</span>` : t;
async function post(path, body){ const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json()).detail || r.statusText); return r.json(); }

fetch("/health").then(r=>r.json()).then(h=>{ $("ver").textContent = `v${h.version} · CAD+CFD · solver: ${Object.values(h.solvers).some(Boolean)?"present":"none (cases assembled)"}`; });

window.runDesign = async () => {
  setStatus("Designing…", true); $("cfdBtn").disabled = true;
  try{
    const d = await post("/api/design", {request: $("prompt").value, formats:["step","stl"]});
    lastDesignId = d.design_id; $("cfdBtn").disabled = false;
    const physics = Object.entries(d.physics||{}).map(([k,v])=>`<b>${k}</b><span>${typeof v==="number"?(+v).toFixed(4):v}</span>`).join("");
    $("out").innerHTML = `
      <div class="card"><h3>Design</h3><div class="kv">
        <b>type</b><span>${d.geometry_type}</span>
        <b>confidence</b><span><span class="pill ${d.passed?'ok':'warn'}">${(+d.confidence).toFixed(2)} · ${d.passed?'PASSED':'REVIEW'}</span></span>
      </div></div>
      <div class="card"><h3>Physics</h3><div class="kv">${physics||'<span class="hint">n/a</span>'}</div></div>
      ${ (d.warnings&&d.warnings.length)?`<div class="card"><h3>Warnings</h3><pre>${d.warnings.join("\\n")}</pre></div>`:"" }
      <div class="card"><h3>Files</h3><div class="kv">${Object.entries(d.files).map(([f,u])=>`<b>${f.toUpperCase()}</b><span><a href="${u}">${u.split("/").pop()}</a></span>`).join("")}</div></div>`;
    if(d.files.stl) showSTL(d.files.stl);
    setStatus("Done.");
  }catch(e){ setStatus("Error: "+e.message); }
};
window.runOptimize = async () => {
  setStatus("Optimizing (CAD→evaluate→CAD)…", true);
  try{
    const d = await post("/api/optimize", {request: $("prompt").value, max_iterations: 8});
    const rows = d.history.map((h,i)=>`#${i+1} ${h.decision} · ${Object.entries(h.quantities).map(([k,v])=>k+"="+(+v).toFixed(3)).join(", ")}`).join("\\n");
    $("out").innerHTML = `<div class="card"><h3>Optimization</h3><div class="kv">
        <b>evaluator</b><span>${d.evaluator}</span>
        <b>result</b><span><span class="pill ${d.converged?'ok':'warn'}">${d.final_decision}</span></span>
        <b>iterations</b><span>${d.iterations_run}</span>
      </div><pre>${rows}</pre>
      <div class="kv" style="margin-top:8px">${Object.entries(d.best_quantities).map(([k,v])=>`<b>${k}</b><span>${(+v).toFixed(4)}</span>`).join("")}</div>
      <pre>${d.rationale}</pre></div>`;
    setStatus("Done.");
  }catch(e){ setStatus("Error: "+e.message); }
};
window.runCompliance = async () => {
  setStatus("Checking compliance…", true);
  try{
    const d = await post("/api/compliance", {request: $("prompt").value});
    $("out").innerHTML = `<div class="card"><h3>Compliance Advisory</h3><div class="kv">
        <b>export-flagged</b><span><span class="pill ${d.export_control_flagged?'warn':'ok'}">${d.export_control_flagged}</span></span>
      </div>
      <pre>Export categories:\\n - ${(d.export_categories||[]).join("\\n - ")||"none"}\\n\\nAirworthiness:\\n - ${(d.airworthiness_standards||[]).join("\\n - ")}\\n\\n${d.disclaimer}</pre></div>`;
    setStatus("Done.");
  }catch(e){ setStatus("Error: "+e.message); }
};
window.runCFD = async () => {
  if(!lastDesignId){ setStatus("Run a design first."); return; }
  setStatus("Running CFD pipeline…", true);
  try{
    const d = await post("/api/cfd", {design_id: lastDesignId});
    $("out").innerHTML += `<div class="card"><h3>CFD</h3><div class="kv">
        <b>domain</b><span>${d.domain}</span>
        <b>mesh cells</b><span>${d.mesh.cells.toLocaleString()}</span>
        <b>solver</b><span>${d.solver}</span>
        <b>turbulence</b><span>${d.turbulence_model}</span>
        <b>decision</b><span><span class="pill warn">${d.decision}</span></span>
      </div><pre>${d.rationale}</pre></div>`;
    setStatus("Done.");
  }catch(e){ setStatus("Error: "+e.message); }
};
</script>
</body>
</html>
