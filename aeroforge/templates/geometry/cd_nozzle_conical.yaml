template:
  id: cd_nozzle_conical
  version: 1.0.0
  name: Convergent-Divergent Conical Nozzle
  category: propulsion/nozzle
  builder: cd_nozzle
  validated_against:
    - "Sutton & Biblarz, Rocket Propulsion Elements"
    - "NASA SP-8076"
  parameters:
    throat_radius_m: {type: float, range: [0.005, 1.0], default: 0.05}
    exit_mach: {type: float, range: [1.05, 6.0], default: 2.5}
    nozzle_type: {type: str, default: conical}
    cone_half_angle_deg: {type: float, range: [10.0, 20.0], default: 15.0}
    wall_thickness_m: {type: float, range: [0.001, 0.05], default: 0.003}
  derived_quantities:
    expansion_ratio: "isentropic.area_mach_ratio(exit_mach)"
    exit_radius_m: "throat_radius_m * sqrt(expansion_ratio)"
  constraints:
    - "exit_mach > 1.0"
    - "wall_thickness_m >= 0.001"
  manufacturing_constraints:
    min_wall_thickness_m: 0.001
  output_geometry:
    components: [nozzle_wall_solid_of_revolution]
    assembly_type: revolve_cut
    export_formats: [STEP, IGES, STL, BREP]
